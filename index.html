<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Center</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --green: #10b981;
            --red: #ef4444;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
        body { margin: 0; padding: 14px; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px 16px; border-radius: 16px; margin-bottom: 14px; }
        .balance-box { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; }
        .coin { background: #f59e0b; color: #000; width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; }
        .bonus-btn { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid var(--green); padding: 6px 12px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; }
        .bonus-btn:active { transform: scale(0.95); }
        .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
        .nav-btn { background: var(--card); border: 2px solid transparent; color: var(--muted); padding: 10px 4px; border-radius: 12px; font-size: 12px; font-weight: 600; text-align: center; cursor: pointer; }
        .nav-btn.active { border-color: var(--accent); color: var(--text); background: rgba(59, 130, 246, 0.15); }
        .nav-icon { font-size: 20px; display: block; margin-bottom: 4px; }
        .game-card { background: var(--card); border-radius: 20px; padding: 16px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .hidden { display: none !important; }
        .rocket-screen { position: relative; height: 200px; background: radial-gradient(circle at bottom, #1e3a8a 0%, #0f172a 100%); border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; margin-bottom: 14px; border: 1px solid #334155; }
        .multiplier { font-size: 46px; font-weight: 800; z-index: 2; }
        .multiplier.crashed { color: var(--red); }
        .multiplier.cashed { color: var(--green); }
        .status-text { font-size: 13px; color: var(--muted); z-index: 2; margin-top: 4px; text-align: center; padding: 0 10px; }
        .rocket-emoji { position: absolute; bottom: 20px; left: 20px; font-size: 40px; transition: transform 0.1s linear; z-index: 1; }
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
        .mine-cell { aspect-ratio: 1; background: #0f172a; border: 1px solid #334155; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
        .mine-cell.open-gem { background: rgba(16, 185, 129, 0.2); border-color: var(--green); }
        .mine-cell.open-bomb { background: rgba(239, 68, 68, 0.2); border-color: var(--red); }
        .slots-box { display: flex; justify-content: center; gap: 12px; background: #0f172a; padding: 24px 12px; border-radius: 16px; border: 1px solid #334155; margin-bottom: 14px; }
        .slot-reel { width: 76px; height: 86px; background: var(--card); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 44px; border: 2px solid #334155; }
        .cascade-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background: #0f172a; padding: 10px; border-radius: 16px; border: 1px solid #334155; margin-bottom: 14px; }
        .cascade-cell { aspect-ratio: 1; background: var(--card); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: transform 0.2s; }
        .cascade-cell.pop { transform: scale(1.2); background: rgba(59, 130, 246, 0.3); }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        .bet-row { display: flex; gap: 8px; align-items: center; background: var(--bg); padding: 8px 12px; border-radius: 12px; }
        .bet-input { background: transparent; border: none; color: var(--text); font-size: 18px; font-weight: 700; width: 100%; outline: none; }
        .quick-bet { background: var(--card); border: none; color: var(--text); padding: 6px 10px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; }
        .action-btn { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 14px; font-size: 17px; font-weight: 700; cursor: pointer; width: 100%; }
        .action-btn.cashout { background: var(--green); color: #000; }
        .info-bar { text-align: center; font-size: 14px; font-weight: 600; color: var(--muted); min-height: 20px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-box">
            <span class="coin">₵</span>
            <span id="balance">1000</span>
            <span id="status-dot" style="font-size:12px;">🔴</span>
        </div>
        <button type="button" id="btn-bonus" class="bonus-btn">+500 бесплатно</button>
    </div>

    <div class="nav">
        <div class="nav-btn active" data-tab="rocket"><span class="nav-icon">🚀</span>Ракета</div>
        <div class="nav-btn" data-tab="mines"><span class="nav-icon">💣</span>Мины</div>
        <div class="nav-btn" data-tab="slots"><span class="nav-icon">🎰</span>Слоты</div>
        <div class="nav-btn" data-tab="cascade"><span class="nav-icon">💎</span>Каскад</div>
    </div>

    <!-- 1. РАКЕТА -->
    <div id="game-rocket" class="game-card">
        <div class="rocket-screen">
            <div id="mult-display" class="multiplier">1.00x</div>
            <div id="status-display" class="status-text">Сделайте ставку для запуска</div>
            <div id="rocket" class="rocket-emoji">🚀</div>
        </div>
        <div class="controls">
            <div class="bet-row">
                <input type="number" id="bet-rocket" class="bet-input" value="100" min="10">
                <button type="button" class="quick-bet" data-target="bet-rocket" data-mult="0.5">½</button>
                <button type="button" class="quick-bet" data-target="bet-rocket" data-mult="2">2x</button>
                <button type="button" class="quick-bet" data-target="bet-rocket" data-mult="max">MAX</button>
            </div>
            <button type="button" id="rocket-btn" class="action-btn">ЗАПУСТИТЬ РАКЕТУ</button>
        </div>
    </div>

    <!-- 2. МИНЫ -->
    <div id="game-mines" class="game-card hidden">
        <div>
            <div id="mines-info" class="info-bar">5 бомб на поле • Найдите кристаллы</div>
            <div id="mines-grid" class="mines-grid"></div>
        </div>
        <div class="controls">
            <div class="bet-row">
                <input type="number" id="bet-mines" class="bet-input" value="100" min="10">
                <button type="button" class="quick-bet" data-target="bet-mines" data-mult="0.5">½</button>
                <button type="button" class="quick-bet" data-target="bet-mines" data-mult="2">2x</button>
                <button type="button" class="quick-bet" data-target="bet-mines" data-mult="max">MAX</button>
            </div>
            <button type="button" id="mines-btn" class="action-btn">НАЧАТЬ ИГРУ (МИНЫ)</button>
        </div>
    </div>

    <!-- 3. СЛОТЫ -->
    <div id="game-slots" class="game-card hidden">
        <div>
            <div id="slots-info" class="info-bar">3 в ряд = x10 • 2 в ряд = x2</div>
            <div class="slots-box">
                <div id="reel-1" class="slot-reel">🍒</div>
                <div id="reel-2" class="slot-reel">🍋</div>
                <div id="reel-3" class="slot-reel">💎</div>
            </div>
        </div>
        <div class="controls">
            <div class="bet-row">
                <input type="number" id="bet-slots" class="bet-input" value="100" min="10">
                <button type="button" class="quick-bet" data-target="bet-slots" data-mult="0.5">½</button>
                <button type="button" class="quick-bet" data-target="bet-slots" data-mult="2">2x</button>
                <button type="button" class="quick-bet" data-target="bet-slots" data-mult="max">MAX</button>
            </div>
            <button type="button" id="slots-btn" class="action-btn">КРУТИТЬ СЛОТЫ</button>
        </div>
    </div>

    <!-- 4. КАСКАД -->
    <div id="game-cascade" class="game-card hidden">
        <div>
            <div id="cascade-info" class="info-bar">Совпадение от 5 символов запускает взрыв</div>
            <div id="cascade-grid" class="cascade-grid"></div>
        </div>
        <div class="controls">
            <div class="bet-row">
                <input type="number" id="bet-cascade" class="bet-input" value="100" min="10">
                <button type="button" class="quick-bet" data-target="bet-cascade" data-mult="0.5">½</button>
                <button type="button" class="quick-bet" data-target="bet-cascade" data-mult="2">2x</button>
                <button type="button" class="quick-bet" data-target="bet-cascade" data-mult="max">MAX</button>
            </div>
            <button type="button" id="cascade-btn" class="action-btn">ЗАПУСТИТЬ КАСКАД</button>
        </div>
    </div>

    <script>
        document.getElementById('status-dot').innerText = '🟢';
        var tg = null;
        try { if (window.Telegram && window.Telegram.WebApp) { tg = window.Telegram.WebApp; tg.ready(); tg.expand(); } } catch (e) {}
        function vibrate(type) { try { if (tg && tg.HapticFeedback) { tg.HapticFeedback.notificationOccurred(type); } } catch (e) {} }

        var balance = 1000;
        try { var saved = localStorage.getItem('virtual_balance_v5'); if (saved && !isNaN(parseInt(saved))) { balance = parseInt(saved); } } catch (e) {}
        var balanceEl = document.getElementById('balance');
        function updateBalance(newBal) {
            balance = Math.max(0, Math.floor(newBal));
            balanceEl.innerText = balance;
            try { localStorage.setItem('virtual_balance_v5', balance); } catch (e) {}
        }
        updateBalance(balance);

        document.getElementById('btn-bonus').addEventListener('click', function() {
            if (balance < 100) { updateBalance(balance + 500); vibrate('success'); }
            else { var btn = document.getElementById('btn-bonus'); btn.innerText = 'Нужно < 100 ₵'; setTimeout(function() { btn.innerText = '+500 бесплатно'; }, 1200); }
        });

        var busy = false;
        document.querySelectorAll('.nav-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                if (busy) return;
                document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                var tab = btn.getAttribute('data-tab');
                ['rocket', 'mines', 'slots', 'cascade'].forEach(function(id) { document.getElementById('game-' + id).classList.add('hidden'); });
                document.getElementById('game-' + tab).classList.remove('hidden');
            });
        });

        document.querySelectorAll('.quick-bet').forEach(function(btn) {
            btn.addEventListener('click', function() {
                if (busy) return;
                var input = document.getElementById(btn.getAttribute('data-target'));
                var mult = btn.getAttribute('data-mult');
                var val = parseInt(input.value) || 100;
                if (mult === 'max') val = balance; else val = Math.max(10, Math.floor(val * parseFloat(mult)));
                input.value = Math.min(val, balance);
            });
        });

        var rocketFlying = false, currentMult = 1.00, crashPoint = 1.00, rocketBet = 0, rocketTimer = null;
        document.getElementById('rocket-btn').addEventListener('click', function() {
            var btn = document.getElementById('rocket-btn'), multEl = document.getElementById('mult-display'), statusEl = document.getElementById('status-display'), rocketEl = document.getElementById('rocket');
            if (!rocketFlying) {
                var bet = parseInt(document.getElementById('bet-rocket').value);
                if (!bet || bet <= 0 || bet > balance) { statusEl.innerText = '⚠️ Не хватает монет!'; return; }
                updateBalance(balance - bet); rocketBet = bet; rocketFlying = true; busy = true; currentMult = 1.00;
                var r = Math.random(); crashPoint = r < 0.08 ? 1.00 : Math.min(40, Math.max(1.06, 0.95 / (1 - r)));
                multEl.className = 'multiplier'; statusEl.innerText = 'Ракета набирает высоту...'; btn.innerText = 'ЗАБРАТЬ (' + bet + ' ₵)'; btn.classList.add('cashout');
                rocketTimer = setInterval(function() {
                    currentMult += 0.01 * (currentMult * 0.65);
                    if (currentMult >= crashPoint) {
                        clearInterval(rocketTimer); rocketFlying = false; busy = false; multEl.innerText = crashPoint.toFixed(2) + 'x'; multEl.classList.add('crashed');
                        statusEl.innerText = '💥 Взрыв! Ставка сгорела.'; rocketEl.innerText = '💥'; btn.innerText = 'ЗАПУСТИТЬ РАКЕТУ'; btn.classList.remove('cashout'); vibrate('error');
                        setTimeout(function() { rocketEl.innerText = '🚀'; rocketEl.style.transform = 'translate(0, 0)'; }, 1200);
                    } else {
                        multEl.innerText = currentMult.toFixed(2) + 'x'; btn.innerText = 'ЗАБРАТЬ (' + Math.floor(rocketBet * currentMult) + ' ₵)';
                        rocketEl.style.transform = 'translate(' + Math.min(200, (currentMult - 1) * 45) + 'px, -' + Math.min(120, (currentMult - 1) * 30) + 'px)';
                    }
                }, 60);
            } else {
                clearInterval(rocketTimer); rocketFlying = false; busy = false; var win = Math.floor(rocketBet * currentMult); updateBalance(balance + win);
                multEl.classList.add('cashed'); statusEl.innerText = '🎉 Успех! Вы забрали ' + win + ' ₵'; btn.innerText = 'ЗАПУСТИТЬ РАКЕТУ'; btn.classList.remove('cashout'); vibrate('success');
                setTimeout(function() { rocketEl.style.transform = 'translate(0, 0)'; }, 800);
            }
        });

        var minesGridEl = document.getElementById('mines-grid'), minesActive = false, minePositions = [], minesBet = 0, gemsFound = 0;
        function renderEmptyMines() {
            minesGridEl.innerHTML = '';
            for (var i = 0; i < 25; i++) {
                (function(idx) {
                    var cell = document.createElement('div'); cell.className = 'mine-cell'; cell.innerText = '❓';
                    cell.addEventListener('click', function() { handleMineClick(idx, cell); }); minesGridEl.appendChild(cell);
                })(i);
            }
        }
        renderEmptyMines();

        document.getElementById('mines-btn').addEventListener('click', function() {
            var btn = document.getElementById('mines-btn'), info = document.getElementById('mines-info');
            if (!minesActive) {
                var bet = parseInt(document.getElementById('bet-mines').value);
                if (!bet || bet <= 0 || bet > balance) { info.innerText = '⚠️ Недостаточно монет!'; return; }
                updateBalance(balance - bet); minesBet = bet; minesActive = true; busy = true; gemsFound = 0; minePositions = [];
                while (minePositions.length < 5) { var pos = Math.floor(Math.random() * 25); if (minePositions.indexOf(pos) === -1) minePositions.push(pos); }
                renderEmptyMines(); info.innerText = 'Открывайте клетки! Множитель: 1.00x'; btn.innerText = 'ЗАБРАТЬ (' + bet + ' ₵)'; btn.classList.add('cashout');
            } else {
                var mult = 1 + (gemsFound * 0.25), win = Math.floor(minesBet * mult); updateBalance(balance + win); minesActive = false; busy = false;
                info.innerText = '🎉 Вы забрали ' + win + ' ₵ (' + mult.toFixed(2) + 'x)!'; btn.innerText = 'НАЧАТЬ ИГРУ (МИНЫ)'; btn.classList.remove('cashout'); vibrate('success');
            }
        });

        function handleMineClick(index, cell) {
            if (!minesActive || cell.classList.contains('open-gem')) return;
            var btn = document.getElementById('mines-btn'), info = document.getElementById('mines-info');
            if (minePositions.indexOf(index) !== -1) {
                minesActive = false; busy = false; var allCells = minesGridEl.children;
                minePositions.forEach(function(pos) { allCells[pos].classList.add('open-bomb'); allCells[pos].innerText = '💣'; });
                info.innerText = '💥 Бум! Вы попали на мину.'; btn.innerText = 'НАЧАТЬ ИГРУ (МИНЫ)'; btn.classList.remove('cashout'); vibrate('error');
            } else {
                cell.classList.add('open-gem'); cell.innerText = '💎'; gemsFound++;
                var mult = 1 + (gemsFound * 0.25), win = Math.floor(minesBet * mult);
                info.innerText = '💎 Кристаллов: ' + gemsFound + ' • Множитель: ' + mult.toFixed(2) + 'x'; btn.innerText = 'ЗАБРАТЬ (' + win + ' ₵)'; vibrate('success');
            }
        }

        var slotSymbols = ['🍒', '🍋', '🍇', '🔔', '💎', '7️⃣'];
        document.getElementById('slots-btn').addEventListener('click', function() {
            if (busy) return;
            var bet = parseInt(document.getElementById('bet-slots').value), info = document.getElementById('slots-info');
            if (!bet || bet <= 0 || bet > balance) { info.innerText = '⚠️ Недостаточно монет!'; return; }
            updateBalance(balance - bet); busy = true; info.innerText = 'Барабаны крутятся...';
            var ticks = 0, spinTimer = setInterval(function() {
                document.getElementById('reel-1').innerText = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
                document.getElementById('reel-2').innerText = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
                document.getElementById('reel-3').innerText = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
                ticks++;
                if (ticks > 12) {
                    clearInterval(spinTimer); busy = false;
                    var r1 = document.getElementById('reel-1').innerText, r2 = document.getElementById('reel-2').innerText, r3 = document.getElementById('reel-3').innerText;
                    if (r1 === r2 && r2 === r3) { var win = bet * 10; updateBalance(balance + win); info.innerText = '🔥 ДЖЕКПОТ x10! Выигрыш: ' + win + ' ₵'; vibrate('success'); }
                    else if (r1 === r2 || r2 === r3 || r1 === r3) { var win2 = bet * 2; updateBalance(balance + win2); info.innerText = '✨ Совпадение x2! Выигрыш: ' + win2 + ' ₵'; vibrate('success'); }
                    else { info.innerText = 'Нет совпадений. Попробуйте еще раз!'; }
                }
            }, 80);
        });

                var cascadeIcons = ['🍎', '🍊', '🍇', '💎', '⭐'], cascadeGridEl = document.getElementById('cascade-grid'), cascadeBoard = [];
        function fillCascadeBoard() {
            cascadeGridEl.innerHTML = ''; cascadeBoard = [];
            for (var i = 0; i < 20; i++) {
                var icon = cascadeIcons[Math.floor(Math.random() * cascadeIcons.length)]; cascadeBoard.push(icon);
                var cell = document.createElement('div'); cell.className = 'cascade-cell'; cell.innerText = icon; cascadeGridEl.appendChild(cell);
            }
        }
        fillCascadeBoard();

        document.getElementById('cascade-btn').addEventListener('click', function() {
            if (busy) return;
            var bet = parseInt(document.getElementById('bet-cascade').value), info = document.getElementById('cascade-info');
            if (!bet || bet <= 0 || bet > balance) { info.innerText = '⚠️ Недостаточно монет!'; return; }
            updateBalance(balance - bet); busy = true; var totalWin = 0, combo = 1;
            function runCascadeStep() {
                fillCascadeBoard(); var counts = {};
                cascadeBoard.forEach(function(sym) { counts[sym] = (counts[sym] || 0) + 1; });
                var matchedSym = null;
                for (var sym in counts) { if (counts[sym] >= 5) { matchedSym = sym; break; } }
                if (matchedSym) {
                    var stepWin = Math.floor(bet * 0.8 * combo); totalWin += stepWin;
                    Array.from(cascadeGridEl.children).forEach(function(cell, idx) { if (cascadeBoard[idx] === matchedSym) cell.classList.add('pop'); });
                    info.innerText = '💥 Каскад x' + combo + '! Собрано ' + counts[matchedSym] + 'x ' + matchedSym + ' (+' + stepWin + ' ₵)';
                    combo++; vibrate('success'); setTimeout(runCascadeStep, 700);
                } else {
                    busy = false;
                    if (totalWin > 0) { updateBalance(balance + totalWin); info.innerText = '🎉 Серия завершена! Общий выигрыш: ' + totalWin + ' ₵'; }
                    else { info.innerText = 'Кластеров от 5 символов не выпало.'; }
                }
            }
            runCascadeStep();
        });
    </script>
</body>
</html>
